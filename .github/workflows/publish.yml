name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0-SNAPSHOT'

jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Resolve version from tag or input
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      # Use a Personal Access Token (PAT) stored in repo secrets,
      # because the default GITHUB_TOKEN is read-only for GitHub Packages writes.
      - name: Publish webx-core
        run: ./gradlew :webx-core:publish --no-daemon -Pversion=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: daiwenzh5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_PUBLISH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Publish webx-sb2-starter
        run: ./gradlew :webx-sb2-starter:publish --no-daemon -Pversion=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: daiwenzh5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_PUBLISH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Publish webx-sb3-starter
        run: ./gradlew :webx-sb3-starter:publish --no-daemon -Pversion=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: daiwenzh5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_PUBLISH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            webx-core/build/libs/*.jar
            webx-core/build/libs/*.pom
            webx-sb2-starter/build/libs/*.jar
            webx-sb2-starter/build/libs/*.pom
            webx-sb3-starter/build/libs/*.jar
            webx-sb3-starter/build/libs/*.pom
